version: "3.8"

services:
  web:
    build: .
    container_name: fixloop_platform
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PORT=5000
      - HOST=0.0.0.0
    volumes:
      - ./app/data:/app/app/data
      - ./app/static/uploads:/app/app/static/uploads
    restart: unless-stopped
