{% extends "base.html" %}

{% block title %}Page Not Found (404) — FixLoop{% endblock %}

{% block content %}
<div style="text-align: center; padding: 60px 20px;">
    <i class="fa-solid fa-triangle-exclamation" style="font-size: 4rem; color: #f59e0b; margin-bottom: 20px;"></i>
    <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 10px;">404 — Page Not Found</h1>
    <p style="font-size: 1.1rem; color: var(--text-muted); max-width: 500px; margin: 0 auto 25px;">
        The page or repair ticket record you were looking for could not be located.
    </p>
    <a href="{{ url_for('public.home') }}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Return to Homepage</a>
</div>
{% endblock %}
