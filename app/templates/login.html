{% extends "base.html" %}

{% block title %}Sign In — FixLoop{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 40px auto;">
    <div class="card">
        <h2 class="card-title" style="text-align: center; justify-content: center;">
            <i class="fa-solid fa-right-to-bracket" style="color: var(--primary-color);"></i> Sign In to FixLoop
        </h2>
        
        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="customer@fixloop.org" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
                <i class="fa-solid fa-lock"></i> Sign In
            </button>
        </form>

        <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center;">
            <p style="font-size: 0.9rem; color: var(--text-muted);">Don't have an account?</p>
            <a href="{{ url_for('auth.register') }}" class="btn btn-outline btn-sm btn-block" style="margin-top: 8px;">
                Create an Account
            </a>
        </div>
        
        <div style="margin-top: 20px; background: #f8fafc; padding: 15px; border-radius: 6px; font-size: 0.85rem; text-align: center; border: 1px solid #e2e8f0;">
            <strong><i class="fa-solid fa-lightbulb" style="color: #f59e0b;"></i> Quick Test Login Credentials:</strong>
            <div style="margin-top: 6px; color: #475569;">
                Password for all demo accounts: <code style="background: #e2e8f0; padding: 2px 6px; border-radius: 4px;">password123</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
